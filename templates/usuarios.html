<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuarios Registrados</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f4f4f4;
padding:30px;
}

.container{
max-width:1200px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
text-align:center;
margin-bottom:20px;
}

form{
margin-bottom:20px;
}

input{
padding:10px;
width:300px;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:10px 20px;
background:#007bff;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#007bff;
color:white;
padding:12px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #ddd;
}

tr:nth-child(even){
background:#f9f9f9;
}

.eliminar{
background:red;
padding:8px;
color:white;
text-decoration:none;
border-radius:5px;
}

.volver{
display:inline-block;
margin-top:20px;
padding:10px 20px;
background:#28a745;
color:white;
text-decoration:none;
border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h1>Consulta de Usuarios</h1>

<form action="/buscar">

<input
type="text"
name="nombre"
placeholder="Buscar usuario">

<button type="submit">

Buscar

</button>

</form>

<table>

<tr>
<th>Nombre</th>
<th>Correo</th>
<th>Teléfono</th>
<th>Ciudad</th>
<th>Fecha Registro</th>
<th>Acción</th>
</tr>

{% for usuario in usuarios %}

<tr>

<td>{{ usuario["nombre"] }}</td>

<td>{{ usuario["correo"] }}</td>

<td>{{ usuario["telefono"] }}</td>

<td>{{ usuario["ciudad"] }}</td>

<td>{{ usuario["fecha"] }}</td>

<td>

<a
class="eliminar"
href="/eliminar/{{ usuario['_id'] }}">

Eliminar

</a>

</td>

</tr>

{% endfor %}

</table>

<a class="volver" href="/">

Volver al Inicio

</a>

</div>

</body>
</html>
