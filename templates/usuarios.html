<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios Registrados</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            padding:40px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-bottom:20px;
        }

        table th{
            background:#007bff;
            color:white;
            padding:12px;
        }

        table td{
            padding:12px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

        table tr:nth-child(even){
            background:#f9f9f9;
        }

        table tr:hover{
            background:#f1f1f1;
        }

        .btn{
            display:inline-block;
            padding:10px 20px;
            background:#007bff;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .btn:hover{
            background:#0056b3;
        }

        .center{
            text-align:center;
        }

        .sin-registros{
            text-align:center;
            color:#666;
            font-size:18px;
            margin:20px 0;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Usuarios Registrados</h1>

        {% if usuarios %}

        <table>

            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                </tr>
            </thead>

            <tbody>

                {% for usuario in usuarios %}

                <tr>
                    <td>{{ usuario.nombre }}</td>
                    <td>{{ usuario.correo }}</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

        {% else %}

        <div class="sin-registros">
            No hay usuarios registrados.
        </div>

        {% endif %}

        <div class="center">
            <a href="/" class="btn">
                Volver al Inicio
            </a>
        </div>

    </div>

</body>

</html>
