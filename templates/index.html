<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
            width:400px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

        .link{
            text-align:center;
            margin-top:15px;
        }

        .link a{
            text-decoration:none;
            color:#007bff;
            font-weight:bold;
        }

        .link a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Registro de Usuarios</h1>

        <form action="/registrar" method="POST">

            <input
                type="text"
                name="nombre"
                placeholder="Ingrese su nombre"
                required>

            <input
                type="email"
                name="correo"
                placeholder="Ingrese su correo"
                required>

            <button type="submit">
                Registrar Usuario
            </button>

        </form>

        <div class="link">
            <a href="/usuarios">
                Ver Usuarios Registrados
            </a>
        </div>

    </div>

</body>

</html>
